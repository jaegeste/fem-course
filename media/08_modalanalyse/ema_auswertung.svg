  <style>text{font-family:Arial,sans-serif;font-size:19px;fill:#243746}.small{font-size:16px}.box{fill:#eef5f1;stroke:#317451;stroke-width:2}.line{fill:none;stroke:#34495e;stroke-width:2.5;marker-end:url(#arrow)}</style>
