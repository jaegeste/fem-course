<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title">
  <title id="title">Measurement setup</title>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8Z" fill="#34495e" />
    </marker>
  </defs>
  <style>text{font-family:Arial,sans-serif;font-size:19px;fill:#243746}.small{font-size:16px}.box{fill:#eef5f1;stroke:#317451;stroke-width:2}.line{fill:none;stroke:#34495e;stroke-width:2.5;marker-end:url(#arrow)}</style>
  <rect width="1000" height="300" fill="white" />
  <rect class="box" x="60" y="115" width="430" height="55" rx="5" />
  <rect x="50" y="105" width="20" height="85" fill="#87939a" />
  <path d="M165 42 H195 V60 H165 Z" fill="#87939a" stroke="#34495e" />
  <path class="line" d="M180 65 V110" />
  <text x="225" y="45" text-anchor="start" class="small">Impact hammer with force sensor</text>
  <text x="220" y="100" text-anchor="middle">F(t)</text>
  <text x="280" y="205" text-anchor="middle">Structure</text>
  <rect x="370" y="95" width="30" height="20" fill="#c98c2b" />
  <path class="line" d="M385 90 V58" />
  <text x="480" y="75" text-anchor="middle">a(t)</text>
  <text x="500" y="90" text-anchor="start" class="small">Accelerometer</text>
  <rect class="box" x="720" y="145" width="240" height="85" rx="8" />
  <text x="840" y="180" text-anchor="middle">Data acquisition</text>
  <text x="840" y="208" text-anchor="middle" class="small">Force + response</text>
  <path class="line" d="M180 42 V20 H690 V165 H715" />
  <path class="line" d="M400 100 H670 V205 H715" />
  <text x="500" y="275" text-anchor="middle" class="small">Roving hammer: fixed sensor / multiple impact points</text>
  <circle cx="180" cy="115" r="4" fill="#317451" />
  <circle cx="260" cy="115" r="4" fill="#317451" />
  <circle cx="340" cy="115" r="4" fill="#317451" />
  <circle cx="440" cy="115" r="4" fill="#317451" />
</svg>