<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-labelledby="title">
  <title id="title">Processing chain</title>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8Z" fill="#34495e" />
    </marker>
  </defs>
  <style>text{font-family:Arial,sans-serif;font-size:19px;fill:#243746}.small{font-size:16px}.box{fill:#eef5f1;stroke:#317451;stroke-width:2}.line{fill:none;stroke:#34495e;stroke-width:2.5;marker-end:url(#arrow)}</style>
  <rect width="1000" height="250" fill="white" />
  <rect class="box" x="20" y="35" width="290" height="130" rx="9" />
  <text x="165" y="72" text-anchor="middle">Measured signals</text>
  <text x="165" y="110" text-anchor="middle" class="small">Force and response</text>
  <text x="165" y="139" text-anchor="middle" class="small">defined positions/directions</text>
  <path class="line" d="M315 100 H349" />
  <rect class="box" x="355" y="35" width="290" height="130" rx="9" />
  <text x="500" y="72" text-anchor="middle">Complex FRFs</text>
  <text x="500" y="110" text-anchor="middle" class="small">Magnitude and phase</text>
  <text x="500" y="139" text-anchor="middle" class="small">check measurement quality</text>
  <path class="line" d="M650 100 H684" />
  <rect class="box" x="690" y="35" width="290" height="130" rx="9" />
  <text x="835" y="72" text-anchor="middle">Modal parameters</text>
  <text x="835" y="110" text-anchor="middle" class="small">Natural frequencies, damping</text>
  <text x="835" y="139" text-anchor="middle" class="small">spatial mode shapes</text>
  <text x="500" y="215" text-anchor="middle" class="small">Spectral estimation / parameter identification / comparison with the FE model</text>
</svg>